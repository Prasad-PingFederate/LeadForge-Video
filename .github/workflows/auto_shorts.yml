name: Auto Render 9:16 Deal Shorts

on:
  schedule:
    - cron: '35 13 * * *' # Daily at 6:35 PM IST (13:35 UTC)
  repository_dispatch:
    types: [render_top_deals]
  workflow_dispatch:

concurrency:
  group: leadforge-auto-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-and-deliver-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Linux Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests pillow "edge-tts>=6.1.12" piper-tts gtts imageio-ffmpeg google-api-python-client google-auth google-auth-oauthlib

      - name: Render Top Deal Shorts from Queue
        run: |
          python generate_deal_short.py --from-queue

      - name: Upload rendered shorts to Google Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python upload_to_gdrive.py

      - name: Deliver Rendered Shorts to Telegram Staging
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STAGING_CHAT_ID: ${{ secrets.TELEGRAM_STAGING_CHAT_ID || secrets.ADMIN_CHAT_ID }}
        run: |
          python deliver_short.py || true

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-deal-shorts
          path: |
            output/bharatbazaro_*.mp4
            output/bharatbazaro_*.txt
            !output/*_clip_*.mp4
            !output/*_visual.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit & Push Rendered ASINs State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rendered_asins.json
          git diff --cached --quiet || (git commit -m "chore(shorts): update rendered ASIN state [skip ci]" && git push origin main)
